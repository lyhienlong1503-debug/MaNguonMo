{% extends "base.html" %}
{% block title %}{% if book %}Cập nhật Sách{% else %}Thêm Sách mới{% endif %}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white py-3">
                <h5 class="mb-0 fw-bold">
                    {% if book %}Cập nhật thông tin Sách (#{{ book.id }}){% else %}Thêm Sách mới{% endif %}
                </h5>
            </div>
            <div class="card-body">
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Thuộc Danh mục <span class="text-danger">*</span></label>
                        <select name="category_id" class="form-select" required>
                            <option value="">-- Chọn danh mục sách --</option>
                            {% for cat in categories %}
                                <option value="{{ cat.id }}"
                                    {% if (book and book.category_id == cat.id) or (not book and default_cat == cat.id) %}selected{% endif %}>
                                    {{ cat.name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Tên sách <span class="text-danger">*</span></label>
                        <input type="text" name="title" class="form-control" required
                               value="{{ book.title if book else '' }}" placeholder="Nhập tên sách...">
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Tác giả <span class="text-danger">*</span></label>
                            <input type="text" name="author" class="form-control" required
                                   value="{{ book.author if book else '' }}" placeholder="Tên tác giả...">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Năm xuất bản</label>
                            <input type="number" name="published_year" class="form-control" min="1900" max="2100"
                                   value="{{ book.published_year if book else 2026 }}">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Giá bán (VNĐ) <span class="text-danger">*</span></label>
                            <input type="number" name="price" class="form-control" min="0" step="1000" required
                                   value="{{ book.price|int if book else 0 }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Số lượng tồn kho <span class="text-danger">*</span></label>
                            <input type="number" name="stock" class="form-control" min="0" required
                                   value="{{ book.stock if book else 1 }}">
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-3">
                        <a href="{{ url_for('list_books') }}" class="btn btn-outline-secondary">Quay lại</a>
                        <button type="submit" class="btn btn-primary">Lưu thông tin</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
