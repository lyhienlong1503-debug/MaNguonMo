<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Quản lý Sách - Mã nguồn mở{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
        }
        /* Giữ bảng cố định chiều rộng 100%, không bao giờ sinh thanh cuộn ngang */
        .table-fixed {
            table-layout: fixed;
            width: 100%;
        }
        .table-fixed th, .table-fixed td {
            vertical-align: middle;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .btn-icon {
            width: 32px;
            height: 32px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
        <div class="container-xl">
            <a class="navbar-brand fw-bold" href="{{ url_for('dashboard') }}">
                <i class="bi bi-journal-bookmark-fill me-1 text-info"></i> THƯ VIỆN QUẢN LÝ SÁCH
            </a>
            <div class="navbar-nav ms-auto gap-1">
                <a class="nav-link {% if request.endpoint == 'dashboard' %}active fw-semibold{% endif %}" href="{{ url_for('dashboard') }}">
                    <i class="bi bi-grid-1x2-fill me-1"></i> Dashboard
                </a>
                <a class="nav-link {% if request.endpoint == 'list_categories' %}active fw-semibold{% endif %}" href="{{ url_for('list_categories') }}">
                    <i class="bi bi-tags-fill me-1"></i> Danh mục Sách
                </a>
                <a class="nav-link {% if 'book' in request.endpoint %}active fw-semibold{% endif %}" href="{{ url_for('list_books') }}">
                    <i class="bi bi-book-half me-1"></i> Quản lý Sách
                </a>
            </div>
        </div>
    </nav>

    <div class="container-xl pb-5">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show shadow-sm" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
