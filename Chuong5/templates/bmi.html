{% extends "base.html" %}
{% block title %}Tính Chỉ Số BMI{% endblock %}
{% block content %}
<style>
    .box-green { background-color: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .box-yellow { background-color: #fef9c3; color: #854d0e; border: 1px solid #fde047; }
    .box-red { background-color: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
</style>

<div class="card">
    <h2>Tính Chỉ Số BMI</h2>
    <p class="subtitle">Nhập chiều cao (50 - 250 cm) và cân nặng (10 - 300 kg)</p>

    <form method="POST">
        <div class="form-group">
            <label>Chiều cao (cm):</label>
            <input type="text" name="chieu_cao" value="{{ chieu_cao }}" placeholder="Ví dụ: 170" required>
        </div>

        <div class="form-group">
            <label>Cân nặng (kg):</label>
            <input type="text" name="can_nang" value="{{ can_nang }}" placeholder="Ví dụ: 65" required>
        </div>

        <button type="submit" class="btn-submit">Tính BMI</button>
    </form>

    {% if error %}
        <div class="alert-error">⚠️ {{ error }}</div>
    {% endif %}

    {% if ket_qua %}
        <div class="result-box box-{{ mau }}">
            <div style="font-size: 24px; margin-bottom: 5px;">BMI: {{ bmi }}</div>
            <div style="font-size: 16px;">Phân loại: {{ loai }}</div>
        </div>
    {% endif %}
</div>
{% endblock %}
